apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kijani-ingress
  namespace: kijani-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: staging.kijanikiosk.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kk-payments
            port:
              number: 80
