groups:
  - name: kijani-alerts
    rules:
    - alert: KijaniPaymentsHighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[2m]) > 0.05
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High error rate on kk-payments"
        description: "Error rate is over 5% for more than 2 minutes."
